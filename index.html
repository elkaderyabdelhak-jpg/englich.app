<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعلم الإنجليزية</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--muted:#6b7385;--accent:#2b5adb;--accent-ink:#fff;--line:#e2dfd6;--ok:#2f8f5b}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#eceff5;--muted:#8d96a8;--accent:#6c8cff;--accent-ink:#0b0e14;--line:#2a3140;--ok:#5fcf93;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;padding:0}
main{max-width:none;margin:0}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.msg{color:var(--muted);text-align:center;padding:32px 0}
.err{color:#b3412f;margin-top:12px}

.top{position:relative;background:#000;color:#fff;padding:28px 20px 42px;text-align:center;border-radius:0 0 50% 50% / 0 0 40px 40px;animation:drop .7s cubic-bezier(.77,0,.18,1)}
.top h1{font-size:22px;margin:0}
.top p{margin:6px 0 0;color:#a9b0bf;font-size:13px}
.bar{height:4px;background:#2a2a2a;border-radius:2px;margin:14px auto 0;max-width:260px}
.bar i{display:block;height:4px;background:#fff;border-radius:2px}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 32px}
@keyframes drop{from{transform:translateY(-100%)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}

.item{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;cursor:pointer;animation:up .45s both}
.item .n{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.item .t{flex:1;display:flex;flex-direction:column;gap:2px}
.item b{font-size:16px;font-weight:600}
.item small{color:var(--muted);font-size:12px}
.item .ok{color:var(--ok);font-weight:700;font-size:18px}
.top .back{position:absolute;right:16px;top:22px;margin:0;color:#a9b0bf;background:none;border:0;font:inherit;font-size:14px;cursor:pointer}
.top h1.lt{margin-top:18px}
.text{white-space:pre-wrap;line-height:1.8;font-size:17px;direction:ltr;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
td{padding:12px;border-bottom:1px solid var(--line)}
td:first-child{direction:ltr;text-align:left;font-weight:600}
.done{margin-top:16px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.gbtn{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:17px;font-weight:600;cursor:pointer;margin-top:16px}
.out{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;padding:0;margin-top:24px;cursor:pointer}

.spk{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.spk.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.sent{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sent:last-child{border:0}
.sent>div{flex:1}
.sent b{display:block;direction:ltr;text-align:left;font-size:16px;font-weight:600}
.sent span{color:var(--muted);font-size:13px}
td.sp{width:52px;text-align:left}
.hero{background:#000;color:#fff;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;border-radius:0 0 50% 50% / 0 0 90px 90px;overflow:hidden;transition:height .9s cubic-bezier(.77,0,.18,1)}
.hero.go{height:260px}
.hero h1{margin:0;font-size:36px;letter-spacing:.02em}
.hero p{margin:10px 0 0;color:#a9b0bf;font-size:16px}
.sheet{max-width:520px;margin:0 auto;padding:32px 20px;opacity:0;transform:translateY(24px);transition:opacity .6s .55s,transform .6s .55s}
.hero.go + .sheet{opacity:1;transform:none}
.sheet h2{font-size:24px;margin:0 0 6px}
@media (prefers-reduced-motion:reduce){.hero,.sheet{transition:none}.top,.item{animation:none}}

.play{position:relative;height:280px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.fall{position:absolute;left:50%;top:0;transform:translateX(-50%);direction:ltr;padding:10px 18px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:20px;white-space:nowrap}
.hud{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:17px;cursor:pointer}
.opt.good{background:var(--ok);color:#fff}
.opt.bad{background:#b3412f;color:#fff}
</style>
</head>
<body>
<main id="app"><div class="hero"><h1>تعلم الإنجليزية</h1><p>كلمة بكلمة، كل نهار</p></div></main>

<script type="module">
import { db, auth } from "./config.js";
import { collection, getDocs, getDoc, query, orderBy, doc, setDoc, increment, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = document.getElementById("app");
const today = new Date().toISOString().slice(0, 10);
const t0 = performance.now();
let splashPlayed = false;

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids);
  return n;
}

let done = [];
try { done = JSON.parse(localStorage.getItem("done") || "[]"); } catch (e) {}
const saveDone = () => { try { localStorage.setItem("done", JSON.stringify(done)); } catch (e) {} };

let lessons = [];

function showLogin(error = "") {
  const g = el("button", { className: "gbtn", textContent: "دخل بـ Google" });
  g.onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { console.error(e); showLogin("ما قدرناش ندخلو. جرب فـ Chrome وعاود."); }
  };
  const hero = el("div", { className: "hero" + (splashPlayed ? " go" : "") },
    el("h1", { textContent: "تعلم الإنجليزية" }),
    el("p", { textContent: "كلمة بكلمة، كل نهار" }));
  const sheet = el("div", { className: "sheet" },
    el("h2", { textContent: "مرحبا بيك" }),
    el("p", { className: "sub", textContent: "دخل بحساب Google ديالك باش تبدا الدروس." }),
    g,
    error ? el("p", { className: "err", textContent: error }) : ""
  );
  app.replaceChildren(hero, sheet);
  if (!splashPlayed) {
    splashPlayed = true;
    const wait = Math.max(0, 1000 - (performance.now() - t0));
    setTimeout(() => requestAnimationFrame(() => hero.classList.add("go")), wait);
  }
}

async function register(u) {
  try {
    const ref = doc(db, "learners", u.uid);
    const s = await getDoc(ref);
    if (!s.exists()) {
      await setDoc(ref, { email: u.email, name: u.displayName || "", createdAt: serverTimestamp() });
      await setDoc(doc(db, "stats", "visitors"), { total: increment(1) }, { merge: true });
    }
    const k = "lastDay_" + u.uid;
    if (localStorage.getItem(k) !== today) {
      await setDoc(doc(db, "daily", today), { count: increment(1) }, { merge: true });
      localStorage.setItem(k, today);
    }
  } catch (e) { console.error(e); }
}

function logoutBtn() {
  const b = el("button", { className: "out", textContent: "خروج" });
  b.onclick = () => signOut(auth);
  return b;
}

function showList() {
  const count = lessons.filter(l => done.includes(l.id)).length;
  const pct = lessons.length ? Math.round(count / lessons.length * 100) : 0;
  const top = el("div", { className: "top" },
    el("h1", { textContent: "تعلم الإنجليزية" }),
    el("p", { textContent: count + " من " + lessons.length + " دروس مكملين" }),
    el("div", { className: "bar" }, el("i", { style: "width:" + pct + "%" })));
  const wrap = el("div", { className: "wrap" });
  if (!lessons.length) wrap.append(el("p", { className: "msg", textContent: "ما كاين حتى درس دابا. رجع شوية من بعد." }));
  lessons.forEach((l, i) => {
    const b = el("button", { className: "item" },
      el("span", { className: "n", textContent: String(i + 1) }),
      el("span", { className: "t" },
        el("b", { textContent: l.title }),
        el("small", { textContent: (l.words ? l.words.length : 0) + " كلمات" })),
      el("span", { className: "ok", textContent: done.includes(l.id) ? "✓" : "" }));
    b.style.animationDelay = (0.3 + i * 0.07) + "s";
    b.onclick = () => showLesson(l);
    wrap.append(b);
  });
  const allWords = lessons.flatMap(l => l.words || []).filter(w => w.en && w.ar);
  if (allWords.length >= 3) {
    const g = el("button", { className: "item" },
      el("span", { className: "n", textContent: "🎮" }),
      el("span", { className: "t" },
        el("b", { textContent: "لعبة الكلمات" }),
        el("small", { textContent: "كلمات كتطيح وكتسمعها بالصوت" })));
    g.style.animationDelay = (0.3 + lessons.length * 0.07) + "s";
    g.onclick = showGame;
    wrap.append(g);
  }
  wrap.append(logoutBtn());
  app.replaceChildren(top, wrap);
}

const canSpeak = "speechSynthesis" in window;
const ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>';
let seq = 0;

function speak(text, btn, next) {
  const my = ++seq;
  try { speechSynthesis.cancel(); } catch (e) {}
  document.querySelectorAll(".spk.on").forEach(b => b.classList.remove("on"));
  if (btn) btn.classList.add("on");
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.9;
  const end = () => {
    if (my !== seq) return;
    if (btn) btn.classList.remove("on");
    if (next) next();
  };
  u.onend = end; u.onerror = end;
  speechSynthesis.speak(u);
}

function spkBtn(text) {
  const b = el("button", { className: "spk" });
  b.innerHTML = ICON;
  b.setAttribute("aria-label", "سمع");
  b.onclick = () => speak(text, b);
  return b;
}

function showGame() {
  const uniq = new Map();
  lessons.flatMap(l => l.words || []).filter(w => w.en && w.ar).forEach(w => uniq.set(w.en, w));
  const ws = [...uniq.values()];
  let seen = [];
  try { seen = JSON.parse(localStorage.getItem("seenWords") || "[]"); } catch (e) {}
  const saveSeen = () => { try { localStorage.setItem("seenWords", JSON.stringify(seen)); } catch (e) {} };
  const pool = ws.filter(w => !seen.includes(w.en)).sort(() => Math.random() - .5);

  const back = el("button", { className: "back", textContent: "← الدروس" });
  const top = el("div", { className: "top" }, back, el("h1", { className: "lt", textContent: "لعبة الكلمات" }));
  const hud = el("div", { className: "hud" });
  const area = el("div", { className: "play" });
  const opts = el("div", { className: "opts" });
  app.replaceChildren(top, el("div", { className: "wrap" }, hud, area, opts));
  let score = 0, lives = 3, raf = 0, cur = null, locked = false, timer = 0;
  const stop = () => { cancelAnimationFrame(raf); clearTimeout(timer); seq++; try { speechSynthesis.cancel(); } catch (e) {} };
  back.onclick = () => { stop(); showList(); };

  function end(text, btnText, onBtn) {
    area.replaceChildren(el("p", { className: "msg", textContent: text }));
    const b = el("button", { className: "done", textContent: btnText });
    b.onclick = onBtn;
    opts.replaceChildren(b);
  }
  function answer(b, w) {
    if (locked) return;
    locked = true;
    cancelAnimationFrame(raf);
    const ok = w === cur;
    if (ok) score++; else lives--;
    [...opts.children].forEach(x => { if (x.dataset.k === "1") x.classList.add("good"); });
    if (b && !ok) b.classList.add("bad");
    timer = setTimeout(next, 900);
  }
  function next() {
    hud.replaceChildren(el("span", { textContent: "النقاط: " + score }), el("span", { textContent: "❤️".repeat(lives) }));
    if (lives <= 0) return end("سالات اللعبة · النقاط: " + score, "كمل", showGame);
    if (!pool.length) return end("ساليتي كاع الكلمات، برافو! 🎉 النقاط: " + score, "بدا من الأول", () => {
      try { localStorage.removeItem("seenWords"); } catch (e) {}
      showGame();
    });
    locked = false;
    cur = pool.pop();
    seen.push(cur.en);
    saveSeen();
    const wrongs = ws.filter(w => w.ar !== cur.ar).sort(() => Math.random() - .5).slice(0, 2);
    const choices = [cur, ...wrongs].sort(() => Math.random() - .5);
    opts.replaceChildren(...choices.map(w => {
      const b = el("button", { className: "opt", textContent: w.ar });
      b.dataset.k = w === cur ? "1" : "0";
      b.onclick = () => answer(b, w);
      return b;
    }));
    const fall = el("div", { className: "fall", textContent: cur.en });
    area.replaceChildren(fall);
    speak(cur.en);
    const dur = Math.max(3500, 8000 - score * 300), start = performance.now();
    const step = now => {
      const p = (now - start) / dur;
      fall.style.top = Math.min(p, 1) * (area.clientHeight - fall.offsetHeight) + "px";
      if (p >= 1) return answer(null, null);
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  next();
}

function showLesson(l) {
  const back = el("button", { className: "back", textContent: "← الدروس" });
  back.onclick = () => { seq++; try { speechSynthesis.cancel(); } catch (e) {} showList(); };
  const finish = el("button", { className: "done" });
  const sync = () => { finish.textContent = done.includes(l.id) ? "مكمل ✓ (كليكي باش تلغيه)" : "كملت هاد الدرس"; };
  finish.onclick = () => {
    done = done.includes(l.id) ? done.filter(x => x !== l.id) : [...done, l.id];
    saveDone(); sync();
  };
  sync();
  const top = el("div", { className: "top" }, back, el("h1", { className: "lt", textContent: l.title }));
  const wrap = el("div", { className: "wrap" });

  if (l.sentences && l.sentences.length) {
    const card = el("div", { className: "card" });
    l.sentences.forEach(s => {
      const row = el("div", { className: "sent" },
        el("div", {}, el("b", { textContent: s.en }), el("span", { textContent: s.ar || "" })));
      if (canSpeak) row.append(spkBtn(s.en));
      card.append(row);
    });
    wrap.append(card);
    if (canSpeak) {
      const all = el("button", { className: "done", textContent: "اسمع الجمل كاملة" });
      all.style.marginTop = "0"; all.style.marginBottom = "12px";
      all.onclick = () => {
        const btns = [...card.querySelectorAll(".spk")];
        let i = 0;
        const go = () => { if (i < btns.length) { const j = i++; speak(l.sentences[j].en, btns[j], go); } };
        go();
      };
      wrap.append(all);
    }
  }
  if (l.content) wrap.append(el("div", { className: "text", textContent: l.content }));
  if (l.words && l.words.length) {
    const t = el("table");
    l.words.forEach(w => {
      const tr = el("tr", {}, el("td", { textContent: w.en }), el("td", { textContent: w.ar }));
      if (canSpeak) tr.append(el("td", { className: "sp" }, spkBtn(w.en)));
      t.append(tr);
    });
    wrap.append(t);
  }
  wrap.append(finish);
  app.replaceChildren(top, wrap);
  window.scrollTo(0, 0);
}

onAuthStateChanged(auth, async u => {
  if (!u) return showLogin();
  app.replaceChildren(el("p", { className: "msg", textContent: "كنحمل الدروس…" }));
  register(u);
  try {
    const snap = await getDocs(query(collection(db, "lessons"), orderBy("createdAt")));
    lessons = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    showList();
  } catch (e) {
    console.error(e);
    app.replaceChildren(el("p", { className: "msg", textContent: "ما قدرناش نحملو الدروس. خرج ودخل من جديد." }), logoutBtn());
  }
});
</script>
</body>
</html>
