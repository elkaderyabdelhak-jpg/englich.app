<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعلم الإنجليزية</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--muted:#6b7385;--accent:#2b5adb;--accent-ink:#fff;--line:#e2dfd6;--ok:#2f8f5b}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#eceff5;--muted:#8d96a8;--accent:#6c8cff;--accent-ink:#0b0e14;--line:#2a3140;--ok:#5fcf93;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;padding:24px 16px}
main{max-width:520px;margin:0 auto}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:16px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:17px;cursor:pointer}
.item .t{flex:1}
.item .ok{color:var(--ok);font-weight:700}
.back{background:none;border:0;color:var(--accent);font:inherit;font-size:16px;padding:0;margin-bottom:16px;cursor:pointer}
.text{white-space:pre-wrap;line-height:1.8;font-size:17px;direction:ltr;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
td{padding:12px;border-bottom:1px solid var(--line)}
td:first-child{direction:ltr;text-align:left;font-weight:600}
.done{margin-top:16px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.msg{color:var(--muted);text-align:center;padding:32px 0}
</style>
</head>
<body>
<main id="app"><p class="msg">كنحمل الدروس…</p></main>

<script type="module">
import { db } from "./config.js";
import { collection, getDocs, query, orderBy, doc, setDoc, increment }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = document.getElementById("app");
const today = new Date().toISOString().slice(0, 10);

(async () => {
  try {
    if (!localStorage.getItem("visited")) {
      await setDoc(doc(db, "stats", "visitors"), { total: increment(1) }, { merge: true });
      localStorage.setItem("visited", "1");
    }
    if (localStorage.getItem("lastDay") !== today) {
      await setDoc(doc(db, "daily", today), { count: increment(1) }, { merge: true });
      localStorage.setItem("lastDay", today);
    }
  } catch (e) { console.error(e); }
})();

let done = [];
try { done = JSON.parse(localStorage.getItem("done") || "[]"); } catch (e) {}
const saveDone = () => { try { localStorage.setItem("done", JSON.stringify(done)); } catch (e) {} };

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids);
  return n;
}

let lessons = [];

function showList() {
  app.replaceChildren(
    el("h1", { textContent: "تعلم الإنجليزية" }),
    el("p", { className: "sub", textContent: done.length + " من " + lessons.length + " دروس مكملين" })
  );
  if (!lessons.length) app.append(el("p", { className: "msg", textContent: "ما كاين حتى درس دابا. رجع شوية من بعد." }));
  lessons.forEach(l => {
    const b = el("button", { className: "item" },
      el("span", { className: "t", textContent: l.title }),
      el("span", { className: "ok", textContent: done.includes(l.id) ? "✓" : "" }));
    b.onclick = () => showLesson(l);
    app.append(b);
  });
}

function showLesson(l) {
  const back = el("button", { className: "back", textContent: "← الدروس" });
  back.onclick = showList;
  const finish = el("button", { className: "done" });
  const sync = () => { finish.textContent = done.includes(l.id) ? "مكمل ✓ (كليكي باش تلغيه)" : "كملت هاد الدرس"; };
  finish.onclick = () => {
    done = done.includes(l.id) ? done.filter(x => x !== l.id) : [...done, l.id];
    saveDone(); sync();
  };
  sync();
  app.replaceChildren(back, el("h1", { textContent: l.title }));
  if (l.content) app.append(el("div", { className: "text", textContent: l.content }));
  if (l.words && l.words.length) {
    const t = el("table");
    l.words.forEach(w => t.append(el("tr", {}, el("td", { textContent: w.en }), el("td", { textContent: w.ar }))));
    app.append(t);
  }
  app.append(finish);
}

try {
  const snap = await getDocs(query(collection(db, "lessons"), orderBy("createdAt")));
  lessons = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  showList();
} catch (e) {
  console.error(e);
  app.replaceChildren(el("p", { className: "msg", textContent: "ما قدرناش نحملو الدروس. تأكد من config.js ومن قواعد Firestore." }));
}
</script>
</body>
</html>
